<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LumaDeals AI</title>

<link rel="icon" href="./images/assets/favicon.png">

<style>

  /* =========================================
   LUMADEALS AI — PREMIUM 3D REALISTIC UI
   ========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
  font-family: Inter, Arial, Helvetica, sans-serif;
}

body {
  color: #fff;
  overflow-x: hidden;

  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(59, 180, 236, .20),
      transparent 34%
    ),
    radial-gradient(
      circle at 0% 100%,
      rgba(59, 180, 236, .09),
      transparent 32%
    ),
    linear-gradient(
      145deg,
      #050709 0%,
      #0b1116 48%,
      #050709 100%
    );
}


/* =========================================
   BACKGROUND
   ========================================= */

.ai-background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.ai-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .20;
  animation: orbFloat 10s ease-in-out infinite;
}

.ai-orb.one {
  width: 420px;
  height: 420px;
  top: -180px;
  left: -150px;
  background: #3bb4ec;
}

.ai-orb.two {
  width: 360px;
  height: 360px;
  right: -170px;
  bottom: -170px;
  background: #17617e;
  animation-delay: -5s;
}

@keyframes orbFloat {
  0%, 100% {
    transform: translate3d(0, 0, 0) scale(1);
  }

  50% {
    transform: translate3d(20px, 15px, 0) scale(1.08);
  }
}


/* =========================================
   MAIN PAGE
   ========================================= */

.luma-ai-page {
  position: relative;
  z-index: 1;

  width: 100%;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
}


/* =========================================
   HEADER
   ========================================= */

.luma-ai-topbar {
  position: sticky;
  top: 0;
  z-index: 100;

  width: 100%;
  min-height: 76px;

  padding: 14px 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      180deg,
      rgba(10, 14, 18, .94),
      rgba(7, 10, 13, .78)
    );

  border-bottom: 1px solid rgba(255,255,255,.08);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  box-shadow:
    0 12px 40px rgba(0,0,0,.28),
    inset 0 -1px 0 rgba(255,255,255,.025);
}


/* =========================================
   BRAND
   ========================================= */

.luma-brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.luma-logo {
  width: 45px;
  height: 45px;

  padding: 5px;

  object-fit: contain;

  border-radius: 14px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.15),
      rgba(59,180,236,.07)
    );

  border: 1px solid rgba(59,180,236,.30);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35),
    0 0 22px rgba(59,180,236,.08),
    inset 0 1px 0 rgba(255,255,255,.16);

  transition: .3s ease;
}

.luma-brand:hover .luma-logo {
  transform: rotate(-3deg) scale(1.05);
  border-color: rgba(59,180,236,.55);
  box-shadow:
    0 12px 30px rgba(0,0,0,.4),
    0 0 28px rgba(59,180,236,.16);
}

.luma-brand-text strong {
  display: block;

  font-size: 18px;
  font-weight: 800;

  letter-spacing: -.2px;
}

.luma-brand-text span {
  display: block;

  margin-top: 4px;

  color: rgba(255,255,255,.45);

  font-size: 9px;

  font-weight: 600;

  letter-spacing: 1.6px;
}


/* =========================================
   BACK BUTTON
   ========================================= */

.back-button {
  position: relative;

  border: 1px solid rgba(255,255,255,.10);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  color: rgba(255,255,255,.88);

  padding: 11px 16px;

  border-radius: 13px;

  cursor: pointer;

  font-size: 12px;
  font-weight: 600;

  box-shadow:
    0 7px 20px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.10);

  backdrop-filter: blur(15px);

  transition: .25s ease;
}

.back-button:hover {
  transform: translateY(-2px);

  color: #fff;

  border-color: rgba(59,180,236,.40);

  background:
    rgba(59,180,236,.11);

  box-shadow:
    0 10px 25px rgba(0,0,0,.30),
    0 0 20px rgba(59,180,236,.08);
}

.back-button:active {
  transform: translateY(1px) scale(.97);
}


/* =========================================
   HERO
   ========================================= */

.ai-hero {
  text-align: center;

  padding: 48px 20px 28px;
}


/* =========================================
   AI LOGO / AVATAR
   ========================================= */

.ai-avatar {
  position: relative;

  width: 94px;
  height: 94px;

  margin: 0 auto 21px;

  padding: 13px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 27px;

  background:
    linear-gradient(
      145deg,
      rgba(59,180,236,.22),
      rgba(255,255,255,.045)
    );

  border: 1px solid rgba(59,180,236,.35);

  box-shadow:
    0 25px 60px rgba(0,0,0,.48),
    0 0 45px rgba(59,180,236,.10),
    inset 0 1px 0 rgba(255,255,255,.20),
    inset 0 -8px 18px rgba(0,0,0,.15);

  animation:
    logoFloat 4s ease-in-out infinite;
}

.ai-avatar::before {
  content: "";

  position: absolute;
  inset: -1px;

  border-radius: inherit;

  border: 1px solid rgba(59,180,236,.20);

  opacity: .8;

  animation: logoGlow 3s ease-in-out infinite;
}

.ai-avatar img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  border-radius: 17px;

  filter:
    drop-shadow(0 8px 12px rgba(0,0,0,.35));
}

@keyframes logoFloat {
  0%, 100% {
    transform:
      perspective(700px)
      rotateX(4deg)
      translateY(0);
  }

  50% {
    transform:
      perspective(700px)
      rotateX(4deg)
      translateY(-7px);
  }
}

@keyframes logoGlow {
  0%, 100% {
    box-shadow: 0 0 0 rgba(59,180,236,0);
  }

  50% {
    box-shadow:
      0 0 30px rgba(59,180,236,.16);
  }
}


/* =========================================
   HERO TITLE
   ========================================= */

.ai-hero h1 {
  font-size: clamp(34px, 6vw, 52px);

  font-weight: 850;

  letter-spacing: -1.8px;

  line-height: 1.05;

  background:
    linear-gradient(
      100deg,
      #ffffff 15%,
      #bfeeff 48%,
      #3bb4ec 78%,
      #ffffff 100%
    );

  -webkit-background-clip: text;
  background-clip: text;

  -webkit-text-fill-color: transparent;

  text-shadow:
    0 10px 30px rgba(59,180,236,.08);
}

.ai-hero p {
  margin-top: 12px;

  color: rgba(255,255,255,.52);

  font-size: 13px;

  letter-spacing: .2px;
}


/* =========================================
   CHAT CONTAINER
   ========================================= */

.luma-ai-container {
  position: relative;

  width: min(950px, calc(100% - 30px));

  height: min(670px, calc(100vh - 235px));

  min-height: 480px;

  margin: 0 auto 35px;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 29px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.085),
      rgba(255,255,255,.025)
    );

  border: 1px solid rgba(255,255,255,.12);

  box-shadow:
    0 40px 100px rgba(0,0,0,.50),
    0 0 60px rgba(59,180,236,.045),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(0,0,0,.25);

  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
}

.luma-ai-container::before {
  content: "";

  position: absolute;
  top: 0;
  left: 10%;

  width: 80%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(59,180,236,.5),
      transparent
    );

  pointer-events: none;
}


/* =========================================
   CHAT HEADER
   ========================================= */

.ai-chat-header {
  min-height: 67px;

  padding: 14px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      135deg,
      rgba(59,180,236,.13),
      rgba(255,255,255,.025)
    );

  border-bottom:
    1px solid rgba(255,255,255,.075);

  box-shadow:
    inset 0 -1px 0 rgba(255,255,255,.025);
}

.ai-status {
  display: flex;
  align-items: center;
  gap: 10px;
}

.ai-status-dot {
  width: 9px;
  height: 9px;

  border-radius: 50%;

  background: #3bb4ec;

  box-shadow:
    0 0 8px #3bb4ec,
    0 0 18px rgba(59,180,236,.65);

  animation: statusPulse 2s infinite;
}

@keyframes statusPulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }

  50% {
    transform: scale(.72);
    opacity: .55;
  }
}

.ai-status strong {
  display: block;

  font-size: 13px;
  font-weight: 700;
}

.ai-status span {
  display: block;

  margin-top: 3px;

  color: rgba(255,255,255,.42);

  font-size: 10px;
}

.ai-powered {
  color: rgba(255,255,255,.30);

  font-size: 9px;

  font-weight: 700;

  letter-spacing: 1.2px;
}


/* =========================================
   MESSAGES
   ========================================= */

#luma-ai-messages {
  flex: 1;

  overflow-y: auto;

  padding: 27px;

  scroll-behavior: smooth;
}

#luma-ai-messages::-webkit-scrollbar {
  width: 6px;
}

#luma-ai-messages::-webkit-scrollbar-track {
  background: transparent;
}

#luma-ai-messages::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.12);
  border-radius: 20px;
}

#luma-ai-messages::-webkit-scrollbar-thumb:hover {
  background: rgba(59,180,236,.25);
}


/* =========================================
   MESSAGE BUBBLES
   ========================================= */

.luma-ai-message {
  position: relative;

  width: fit-content;

  max-width: 78%;

  padding: 14px 17px;

  margin-bottom: 15px;

  border-radius: 18px;

  font-size: 14px;

  line-height: 1.65;

  word-wrap: break-word;

  animation: messageIn .28s ease;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}


/* AI */

.luma-ai-message.ai {
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.035)
    );

  border:
    1px solid rgba(255,255,255,.085);

  color: rgba(255,255,255,.90);

  border-bottom-left-radius: 6px;

  box-shadow:
    0 10px 28px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.07);
}


/* USER */

.luma-ai-message.user {
  margin-left: auto;

  background:
    linear-gradient(
      135deg,
      #3bb4ec,
      #2584aa
    );

  border:
    1px solid rgba(122,215,255,.30);

  color: #fff;

  border-bottom-right-radius: 6px;

  box-shadow:
    0 12px 30px rgba(59,180,236,.18),
    inset 0 1px 0 rgba(255,255,255,.25);
}


/* ERROR */

.luma-ai-message.error {
  background:
    rgba(180,35,24,.12);

  border:
    1px solid rgba(255,80,70,.25);

  color: #ffaaa4;
}


/* =========================================
   INPUT AREA
   ========================================= */

.luma-ai-input-area {
  display: flex;

  gap: 10px;

  padding: 15px;

  background:
    linear-gradient(
      180deg,
      rgba(4,7,10,.45),
      rgba(4,7,10,.80)
    );

  border-top:
    1px solid rgba(255,255,255,.075);

  backdrop-filter: blur(20px);
}


/* =========================================
   INPUT
   ========================================= */

#luma-ai-input {
  flex: 1;

  min-width: 0;

  height: 52px;

  border:
    1px solid rgba(255,255,255,.10);

  border-radius: 16px;

  padding: 0 17px;

  outline: none;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.035)
    );

  color: #fff;

  font-size: 14px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 7px 20px rgba(0,0,0,.15);

  transition: .25s ease;
}

#luma-ai-input::placeholder {
  color: rgba(255,255,255,.32);
}

#luma-ai-input:focus {
  border-color:
    rgba(59,180,236,.55);

  background:
    rgba(59,180,236,.045);

  box-shadow:
    0 0 0 3px rgba(59,180,236,.08),
    0 8px 25px rgba(0,0,0,.20);
}


/* =========================================
   SEND BUTTON
   ========================================= */

#luma-ai-send {
  position: relative;

  width: 52px;
  height: 52px;

  flex-shrink: 0;

  border: 0;

  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      #43bdf2,
      #247ea6
    );

  color: #fff;

  font-size: 19px;

  cursor: pointer;

  box-shadow:
    0 10px 28px rgba(59,180,236,.22),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -4px 8px rgba(0,0,0,.12);

  transition: .25s ease;

  overflow: hidden;
}

#luma-ai-send::before {
  content: "";

  position: absolute;

  top: 0;
  left: -100%;

  width: 70%;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.35),
      transparent
    );

  transform: skewX(-20deg);

  animation: sendShine 4s infinite;
}

@keyframes sendShine {
  0%, 55% {
    left: -100%;
  }

  75%, 100% {
    left: 140%;
  }
}

#luma-ai-send:hover {
  transform:
    translateY(-3px)
    scale(1.04);

  box-shadow:
    0 15px 35px rgba(59,180,236,.32),
    0 0 20px rgba(59,180,236,.12),
    inset 0 1px 0 rgba(255,255,255,.4);
}

#luma-ai-send:active {
  transform:
    translateY(1px)
    scale(.95);
}

#luma-ai-send:disabled {
  opacity: .55;
  cursor: not-allowed;
  transform: none;
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

  .luma-ai-topbar {
    min-height: 66px;
    padding: 12px 14px;
  }

  .luma-logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
  }

  .luma-brand {
    gap: 10px;
  }

  .luma-brand-text strong {
    font-size: 16px;
  }

  .luma-brand-text span {
    font-size: 8px;
    letter-spacing: 1.2px;
  }

  .back-button {
    padding: 9px 12px;
    font-size: 11px;
  }

  .ai-hero {
    padding: 32px 15px 20px;
  }

  .ai-avatar {
    width: 72px;
    height: 72px;
    padding: 10px;
    border-radius: 21px;
  }

  .ai-hero h1 {
    font-size: 33px;
    letter-spacing: -1.2px;
  }

  .ai-hero p {
    font-size: 12px;
  }

  .luma-ai-container {
    width: calc(100% - 14px);

    height: calc(100vh - 215px);

    min-height: 440px;

    margin-bottom: 12px;

    border-radius: 22px;
  }

  .ai-chat-header {
    min-height: 60px;
    padding: 12px 14px;
  }

  .ai-powered {
    display: none;
  }

  #luma-ai-messages {
    padding: 18px 13px;
  }

  .luma-ai-message {
    max-width: 88%;
    font-size: 13px;
    padding: 12px 14px;
  }

  .luma-ai-input-area {
    padding: 10px;
  }

  #luma-ai-input {
    height: 48px;
    border-radius: 14px;
    font-size: 13px;
  }

  #luma-ai-send {
    width: 48px;
    height: 48px;
    border-radius: 14px;
  }
}


/* =========================================
   EXTRA SMALL
   ========================================= */

@media (max-width: 380px) {

  .luma-brand-text span {
    display: none;
  }

  .ai-hero h1 {
    font-size: 29px;
  }

  .luma-ai-message {
    max-width: 91%;
  }
}


/* =========================================
   REDUCED MOTION
   ========================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
   }


  

</style>
</head>


<body>

<div class="ai-background">
  <div class="ai-orb one"></div>
  <div class="ai-orb two"></div>
</div>


<div class="luma-ai-page">


  <!-- HEADER -->

  <header class="luma-ai-topbar">

    <div class="luma-brand">

      <img
        src="./images/assets/favicon.png"
        alt="Luma Deals"
        class="luma-logo"
      >

      <div class="luma-brand-text">

        <strong>LumaDeals AI</strong>

        <span>SMART SHOPPING ASSISTANT</span>

      </div>

    </div>


    <button
      type="button"
      class="back-button"
      onclick="window.history.back()"
    >
      ← Back
    </button>

  </header>



  <!-- HERO -->

  <section class="ai-hero">

    <div class="ai-avatar">
  <img
    src="./images/assets/favicon.png"
    alt="Luma Deals"
  >
</div>

    <h1>LumaDeals AI</h1>

    <p>
      Your intelligent shopping assistant
    </p>

  </section>



  

</div>



<script>

/* =========================
   LUMADEALS AI JAVASCRIPT
========================= */

let lumaAIHistory = [];


/* =========================
   MESSAGE
========================= */

function addLumaAIMessage(
  text,
  type = "ai"
) {

  const container =
    document.getElementById(
      "luma-ai-messages"
    );

  if (!container) return null;


  const message =
    document.createElement("div");


  message.className =
    "luma-ai-message " + type;


  message.textContent = text;


  container.appendChild(message);


  container.scrollTop =
    container.scrollHeight;


  return message;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendLumaAIMessage() {

  const input =
    document.getElementById(
      "luma-ai-input"
    );


  const sendButton =
    document.getElementById(
      "luma-ai-send"
    );


  if (!input || !sendButton) return;


  const message =
    input.value.trim();


  if (!message) return;


  input.value = "";


  addLumaAIMessage(
    message,
    "user"
  );


  sendButton.disabled = true;

  sendButton.textContent = "…";


  const loadingMessage =
    addLumaAIMessage(
      "LumaDeals AI is thinking...",
      "ai"
    );


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            message: message,

            history:
              lumaAIHistory

          })

        }
      );


    const data =
      await response.json();


    if (loadingMessage) {
      loadingMessage.remove();
    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "AI request failed"
      );

    }


    const reply =
      data.reply ||
      "Sorry, I couldn't generate a response.";


    addLumaAIMessage(
      reply,
      "ai"
    );


    lumaAIHistory.push(

      {
        role: "user",
        text: message
      },

      {
        role: "model",
        text: reply
      }

    );


    if (
      lumaAIHistory.length > 20
    ) {

      lumaAIHistory =
        lumaAIHistory.slice(-20);

    }


  } catch (error) {

    console.error(
      "LumaDeals AI error:",
      error
    );


    if (loadingMessage) {
      loadingMessage.remove();
    }


    addLumaAIMessage(
      "Sorry, AI is temporarily unavailable. Please try again.",
      "error"
    );

  } finally {

    sendButton.disabled = false;

    sendButton.textContent = "➤";

    input.focus();

  }

}


/* =========================
   ENTER KEY
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const input =
      document.getElementById(
        "luma-ai-input"
      );


    if (input) {

      input.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            sendLumaAIMessage();

          }

        }
      );

    }

  }
);

</script>

</body>
</html>
