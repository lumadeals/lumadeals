<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LumaDeals AI</title>

<link rel="icon" href="./images/assets/luma-deals-ai-logo.jpg">

<style>

  /* =========================================
   LUMADEALS AI — PREMIUM 3D REALISTIC UI
   ========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
  font-family: Inter, Arial, Helvetica, sans-serif;
}

body {
  color: #fff;
  overflow-x: hidden;

  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(59, 180, 236, .20),
      transparent 34%
    ),
    radial-gradient(
      circle at 0% 100%,
      rgba(59, 180, 236, .09),
      transparent 32%
    ),
    linear-gradient(
      145deg,
      #050709 0%,
      #0b1116 48%,
      #050709 100%
    );
}


/* =========================================
   BACKGROUND
   ========================================= */

.ai-background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.ai-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .20;
  animation: orbFloat 10s ease-in-out infinite;
}

.ai-orb.one {
  width: 420px;
  height: 420px;
  top: -180px;
  left: -150px;
  background: #3bb4ec;
}

.ai-orb.two {
  width: 360px;
  height: 360px;
  right: -170px;
  bottom: -170px;
  background: #17617e;
  animation-delay: -5s;
}

@keyframes orbFloat {
  0%, 100% {
    transform: translate3d(0, 0, 0) scale(1);
  }

  50% {
    transform: translate3d(20px, 15px, 0) scale(1.08);
  }
}


/* =========================================
   MAIN PAGE
   ========================================= */

.luma-ai-page {
  position: relative;
  z-index: 1;

  width: 100%;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
}


/* =========================================
   HEADER
   ========================================= */

.luma-ai-topbar {
  position: sticky;
  top: 0;
  z-index: 100;

  width: 100%;
  min-height: 76px;

  padding: 14px 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      180deg,
      rgba(10, 14, 18, .94),
      rgba(7, 10, 13, .78)
    );

  border-bottom: 1px solid rgba(255,255,255,.08);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  box-shadow:
    0 12px 40px rgba(0,0,0,.28),
    inset 0 -1px 0 rgba(255,255,255,.025);
}


/* =========================================
   BRAND
   ========================================= */

.luma-brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.luma-logo {
  width: 45px;
  height: 45px;

  padding: 5px;

  object-fit: contain;

  border-radius: 14px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.15),
      rgba(59,180,236,.07)
    );

  border: 1px solid rgba(59,180,236,.30);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35),
    0 0 22px rgba(59,180,236,.08),
    inset 0 1px 0 rgba(255,255,255,.16);

  transition: .3s ease;
}

.luma-brand:hover .luma-logo {
  transform: rotate(-3deg) scale(1.05);
  border-color: rgba(59,180,236,.55);
  box-shadow:
    0 12px 30px rgba(0,0,0,.4),
    0 0 28px rgba(59,180,236,.16);
}

.luma-brand-text strong {
  display: block;

  font-size: 18px;
  font-weight: 800;

  letter-spacing: -.2px;
}

.luma-brand-text span {
  display: block;

  margin-top: 4px;

  color: rgba(255,255,255,.45);

  font-size: 9px;

  font-weight: 600;

  letter-spacing: 1.6px;
}


/* =========================================
   BACK BUTTON
   ========================================= */

.back-button {
  position: relative;

  border: 1px solid rgba(255,255,255,.10);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  color: rgba(255,255,255,.88);

  padding: 11px 16px;

  border-radius: 13px;

  cursor: pointer;

  font-size: 12px;
  font-weight: 600;

  box-shadow:
    0 7px 20px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.10);

  backdrop-filter: blur(15px);

  transition: .25s ease;
}

.back-button:hover {
  transform: translateY(-2px);

  color: #fff;

  border-color: rgba(59,180,236,.40);

  background:
    rgba(59,180,236,.11);

  box-shadow:
    0 10px 25px rgba(0,0,0,.30),
    0 0 20px rgba(59,180,236,.08);
}

.back-button:active {
  transform: translateY(1px) scale(.97);
}


/* =========================================
   HERO
   ========================================= */

.ai-hero {
  text-align: center;

  padding: 48px 20px 28px;
}


/* =========================================
   AI LOGO / AVATAR
   ========================================= */

.ai-avatar {
  position: relative;

  width: 94px;
  height: 94px;

  margin: 0 auto 21px;

  padding: 13px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 27px;

  background:
    linear-gradient(
      145deg,
      rgba(59,180,236,.22),
      rgba(255,255,255,.045)
    );

  border: 1px solid rgba(59,180,236,.35);

  box-shadow:
    0 25px 60px rgba(0,0,0,.48),
    0 0 45px rgba(59,180,236,.10),
    inset 0 1px 0 rgba(255,255,255,.20),
    inset 0 -8px 18px rgba(0,0,0,.15);

  animation:
    logoFloat 4s ease-in-out infinite;
}

.ai-avatar::before {
  content: "";

  position: absolute;
  inset: -1px;

  border-radius: inherit;

  border: 1px solid rgba(59,180,236,.20);

  opacity: .8;

  animation: logoGlow 3s ease-in-out infinite;
}

.ai-avatar img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  border-radius: 17px;

  filter:
    drop-shadow(0 8px 12px rgba(0,0,0,.35));
}

@keyframes logoFloat {
  0%, 100% {
    transform:
      perspective(700px)
      rotateX(4deg)
      translateY(0);
  }

  50% {
    transform:
      perspective(700px)
      rotateX(4deg)
      translateY(-7px);
  }
}

@keyframes logoGlow {
  0%, 100% {
    box-shadow: 0 0 0 rgba(59,180,236,0);
  }

  50% {
    box-shadow:
      0 0 30px rgba(59,180,236,.16);
  }
}


/* =========================================
   HERO TITLE
   ========================================= */

.ai-hero h1 {
  font-size: clamp(34px, 6vw, 52px);

  font-weight: 850;

  letter-spacing: -1.8px;

  line-height: 1.05;

  background:
    linear-gradient(
      100deg,
      #ffffff 15%,
      #bfeeff 48%,
      #3bb4ec 78%,
      #ffffff 100%
    );

  -webkit-background-clip: text;
  background-clip: text;

  -webkit-text-fill-color: transparent;

  text-shadow:
    0 10px 30px rgba(59,180,236,.08);
}

.ai-hero p {
  margin-top: 12px;

  color: rgba(255,255,255,.52);

  font-size: 13px;

  letter-spacing: .2px;
}


/* =========================================
   CHAT CONTAINER
   ========================================= */

.luma-ai-container {
  position: relative;

  height: calc(100vh - 180px);

  display: flex;
  flex-direction: column;

  overflow: hidden;
}
  background:
    linear-gradient(
      145deg,
      rgba(20,23,26,.82),
      rgba(10,13,15,.72)
    );

  border:
    1px solid rgba(59,180,236,.20);

  border-radius: 28px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.06);

  backdrop-filter: blur(22px);
}


/* TOP LIGHT */

.luma-ai-container::before {
  content: "";

  position: absolute;
  top: 0;
  left: 10%;

  width: 80%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(59,180,236,.55),
      transparent
    );

  pointer-events: none;

  z-index: 2;
}


/* =========================================
   MESSAGES
   ONLY THIS AREA SCROLLS
   ========================================= */

#luma-ai-messages {
  flex: 1;
  min-height: 0;

  overflow-y: auto;
  overflow-x: hidden;

  padding: 27px;

  scroll-behavior: smooth;
}


/* SCROLLBAR */

#luma-ai-messages::-webkit-scrollbar {
  width: 6px;
}

#luma-ai-messages::-webkit-scrollbar-track {
  background: transparent;
}

#luma-ai-messages::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.12);
  border-radius: 20px;
}

#luma-ai-messages::-webkit-scrollbar-thumb:hover {
  background: rgba(59,180,236,.30);
}


/* =========================================
   MESSAGE BUBBLES
   ========================================= */

.luma-ai-message {

  position: relative;

  width: fit-content;

  max-width: 78%;

  padding: 14px 17px;

  border-radius: 18px;

  font-size: 14px;

  line-height: 1.65;

  word-wrap: break-word;

  overflow-wrap: anywhere;

  animation: messageIn .28s ease;
}


@keyframes messageIn {

  from {
    opacity: 0;
    transform: translateY(10px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

}


/* =========================================
   AI MESSAGE
   ========================================= */

.luma-ai-message.ai {

  align-self: flex-start;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.035)
    );

  border:
    1px solid rgba(255,255,255,.085);

  color: rgba(255,255,255,.90);

  border-bottom-left-radius: 6px;

  box-shadow:
    0 10px 28px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.07);
}


/* =========================================
   USER MESSAGE
   ========================================= */

.luma-ai-message.user {

  align-self: flex-end;

  background:
    linear-gradient(
      135deg,
      #3bb4ec,
      #269dcc
    );

  color: #07151c;

  border:
    1px solid rgba(255,255,255,.12);

  border-bottom-right-radius: 6px;

  box-shadow:
    0 10px 28px rgba(59,180,236,.20);
}


/* =========================================
   ERROR MESSAGE
   ========================================= */

.luma-ai-message.error {

  align-self: flex-start;

  background:
    rgba(255,70,70,.10);

  border:
    1px solid rgba(255,70,70,.22);

  color: #ffb5b5;
}

/* =========================================
   FIXED CHAT MESSAGE BAR
   DESKTOP + MOBILE
   ========================================= */

.luma-ai-input-area {
  position: fixed !important;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  width: min(850px, calc(100vw - 40px));

  min-height: 64px;

  padding: 8px 10px 8px 18px;

  display: flex;
  align-items: center;
  gap: 10px;

  box-sizing: border-box;

  z-index: 99999;

  background:
    rgba(20, 23, 26, 0.96);

  border:
    1px solid rgba(59, 180, 236, 0.30);

  border-radius: 20px;

  box-shadow:
    0 15px 50px rgba(0,0,0,.55),
    0 0 30px rgba(59,180,236,.08),
    inset 0 1px 0 rgba(255,255,255,.08);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}


/* =========================================
   TEXT INPUT
   ========================================= */

#luma-ai-input {
  flex: 1;

  width: 100%;
  min-width: 0;

  height: 46px;

  padding: 0 4px;

  border: none;
  outline: none;

  background: transparent;

  color: #ffffff;

  font-size: 15px;
  font-family: inherit;

  box-sizing: border-box;
}

#luma-ai-input::placeholder {
  color: rgba(255,255,255,.42);
}


/* =========================================
   SEND BUTTON
   ========================================= */

#luma-ai-send {
  flex: 0 0 auto;

  width: 46px;
  height: 46px;

  border: none;
  border-radius: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      145deg,
      #3bb4ec,
      #269dcc
    );

  color: #14171a;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 7px 20px rgba(59,180,236,.25);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    opacity .2s ease;
}

#luma-ai-send:hover {
  transform: translateY(-2px);

  box-shadow:
    0 10px 28px rgba(59,180,236,.38);
}

#luma-ai-send:active {
  transform: scale(.94);
}

#luma-ai-send:disabled {
  opacity: .55;
  cursor: not-allowed;
}


/* =========================================
   CHAT MESSAGES
   Leave space for fixed input bar
   ========================================= */

#luma-ai-messages {
  padding-bottom: 120px !important;

  overflow-y: auto;
  overflow-x: hidden;

  scroll-behavior: smooth;
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

  .luma-ai-input-area {

    left: 50%;

    bottom: 10px;

    width: calc(100vw - 20px);

    min-height: 58px;

    padding:
      7px
      8px
      7px
      15px;

    gap: 8px;

    border-radius: 18px;
  }


  #luma-ai-input {

    height: 44px;

    font-size: 14px;
  }


  #luma-ai-send {

    width: 44px;
    height: 44px;

    border-radius: 14px;

    font-size: 18px;
  }


  #luma-ai-messages {

    padding-bottom: 100px !important;
  }
}





/* USER */

.luma-ai-message.user {
  margin-left: auto;

  background:
    linear-gradient(
      135deg,
      #3bb4ec,
      #2584aa
    );

  border:
    1px solid rgba(122,215,255,.30);

  color: #fff;

  border-bottom-right-radius: 6px;

  box-shadow:
    0 12px 30px rgba(59,180,236,.18),
    inset 0 1px 0 rgba(255,255,255,.25);
}


/* ERROR */

.luma-ai-message.error {
  background:
    rgba(180,35,24,.12);

  border:
    1px solid rgba(255,80,70,.25);

  color: #ffaaa4;
}


/* =========================================
   INPUT AREA
   ========================================= */

.luma-ai-input-area {
  display: flex;

  gap: 10px;

  padding: 15px;

  background:
    linear-gradient(
      180deg,
      rgba(4,7,10,.45),
      rgba(4,7,10,.80)
    );

  border-top:
    1px solid rgba(255,255,255,.075);

  backdrop-filter: blur(20px);
}


/* =========================================
   INPUT
   ========================================= */

#luma-ai-input {
  flex: 1;

  min-width: 0;

  height: 52px;

  border:
    1px solid rgba(255,255,255,.10);

  border-radius: 16px;

  padding: 0 17px;

  outline: none;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.035)
    );

  color: #fff;

  font-size: 14px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 7px 20px rgba(0,0,0,.15);

  transition: .25s ease;
}

#luma-ai-input::placeholder {
  color: rgba(255,255,255,.32);
}

#luma-ai-input:focus {
  border-color:
    rgba(59,180,236,.55);

  background:
    rgba(59,180,236,.045);

  box-shadow:
    0 0 0 3px rgba(59,180,236,.08),
    0 8px 25px rgba(0,0,0,.20);
}


/* =========================================
   SEND BUTTON
   ========================================= */

#luma-ai-send {
  position: relative;

  width: 52px;
  height: 52px;

  flex-shrink: 0;

  border: 0;

  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      #43bdf2,
      #247ea6
    );

  color: #fff;

  font-size: 19px;

  cursor: pointer;

  box-shadow:
    0 10px 28px rgba(59,180,236,.22),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -4px 8px rgba(0,0,0,.12);

  transition: .25s ease;

  overflow: hidden;
}

#luma-ai-send::before {
  content: "";

  position: absolute;

  top: 0;
  left: -100%;

  width: 70%;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.35),
      transparent
    );

  transform: skewX(-20deg);

  animation: sendShine 4s infinite;
}

@keyframes sendShine {
  0%, 55% {
    left: -100%;
  }

  75%, 100% {
    left: 140%;
  }
}

#luma-ai-send:hover {
  transform:
    translateY(-3px)
    scale(1.04);

  box-shadow:
    0 15px 35px rgba(59,180,236,.32),
    0 0 20px rgba(59,180,236,.12),
    inset 0 1px 0 rgba(255,255,255,.4);
}

#luma-ai-send:active {
  transform:
    translateY(1px)
    scale(.95);
}

#luma-ai-send:disabled {
  opacity: .55;
  cursor: not-allowed;
  transform: none;
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

  .luma-ai-topbar {
    min-height: 66px;
    padding: 12px 14px;
  }

  .luma-logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
  }

  .luma-brand {
    gap: 10px;
  }

  .luma-brand-text strong {
    font-size: 16px;
  }

  .luma-brand-text span {
    font-size: 8px;
    letter-spacing: 1.2px;
  }

  .back-button {
    padding: 9px 12px;
    font-size: 11px;
  }

  .ai-hero {
    padding: 32px 15px 20px;
  }

  .ai-avatar {
    width: 72px;
    height: 72px;
    padding: 10px;
    border-radius: 21px;
  }

  .ai-hero h1 {
    font-size: 33px;
    letter-spacing: -1.2px;
  }

  .ai-hero p {
    font-size: 12px;
  }

   /* =========================================
   LUMA AI VOICE BUTTON
   ========================================= */

#luma-ai-voice {
  flex: 0 0 auto;

  width: 52px;
  height: 52px;

  border: 1px solid rgba(59,180,236,.35);
  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      rgba(59,180,236,.16),
      rgba(255,255,255,.045)
    );

  color: #3BB4EC;

  font-size: 20px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    0 8px 24px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.10);

  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

#luma-ai-voice:hover {
  transform: translateY(-3px);

  background:
    rgba(59,180,236,.16);

  box-shadow:
    0 12px 30px rgba(59,180,236,.18),
    0 0 20px rgba(59,180,236,.10);
}

#luma-ai-voice:active {
  transform: scale(.94);
}


/* ACTIVE VOICE CALL */

#luma-ai-voice.active {
  background:
    linear-gradient(
      145deg,
      #3bb4ec,
      #2584aa
    );

  color: #14171A;

  border-color: #3bb4ec;

  animation:
    lumaVoicePulse 1.4s infinite;
}

@keyframes lumaVoicePulse {

  0% {
    box-shadow:
      0 0 0 0 rgba(59,180,236,.45);
  }

  70% {
    box-shadow:
      0 0 0 12px rgba(59,180,236,0);
  }

  100% {
    box-shadow:
      0 0 0 0 rgba(59,180,236,0);
  }

}


/* VOICE STATUS */

#luma-ai-voice-status {
  position: fixed;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%) scale(.92);

  z-index: 99998;

  display: none;
  align-items: center;
  gap: 10px;

  padding: 10px 18px 10px 14px;

  border-radius: 30px;

  background:
    linear-gradient(
      145deg,
      rgba(25,30,36,.95),
      rgba(15,18,22,.92)
    );

  border: 1px solid rgba(59,180,236,.35);

  color: rgba(255,255,255,.92);

  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: .2px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.45),
    0 0 25px rgba(59,180,236,.12),
    inset 0 1px 0 rgba(255,255,255,.08);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  opacity: 0;

  transition:
    opacity .3s ease,
    transform .3s cubic-bezier(.34,1.56,.64,1);
}

#luma-ai-voice-status.show {
  display: flex;
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

/* Pulsing dot before text */
#luma-ai-voice-status::before {
  content: "";

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #3BB4EC;

  box-shadow:
    0 0 8px rgba(59,180,236,.9),
    0 0 16px rgba(59,180,236,.5);

  animation: statusDotPulse 1.2s ease-in-out infinite;

  flex-shrink: 0;
}

@keyframes statusDotPulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.5);
    opacity: .5;
  }
}

/* Animated waveform bars */
.luma-voice-wave {
  display: flex;
  align-items: center;
  gap: 2.5px;

  height: 16px;
}

.luma-voice-wave span {
  display: block;

  width: 2.5px;

  border-radius: 3px;

  background:
    linear-gradient(180deg, #7adcff, #3BB4EC);

  box-shadow: 0 0 6px rgba(59,180,236,.5);

  animation: waveBounce 0.9s ease-in-out infinite;
}

<script>

/* =========================
   LUMADEALS AI JAVASCRIPT
========================= */

let lumaAIHistory = [];


/* =========================
   MESSAGE
========================= */

function addLumaAIMessage(
  text,
  type = "ai"
) {

  const container =
    document.getElementById(
      "luma-ai-messages"
    );

  if (!container) return null;


  const message =
    document.createElement("div");


  message.className =
    "luma-ai-message " + type;


  message.textContent = text;


  container.appendChild(message);


  container.scrollTop =
    container.scrollHeight;


  return message;

}

function addLumaAIProducts(products) {

  const container =
    document.getElementById(
      "luma-ai-messages"
    );

  if (!container) return;

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "luma-ai-products";

  products
    .slice(0, 12)
    .forEach((product) => {

      const name =
        product.name ||
        product.title ||
        "Luma Deals Product";

      const price =
        product.price ??
        product.salePrice ??
        product.sale_price ??
        "";

      const oldPrice =
        product.oldPrice ??
        product.old_price ??
        "";

      const image =
        product.img ||
        product.image ||
        product.images?.[0] ||
        "./images/assets/favicon.png";

      const card =
        document.createElement("div");

      card.className =
        "luma-ai-product-card";

      card.innerHTML = `
        <img
          src="${image}"
          alt="${escapeHTML(name)}"
          onerror="this.src='./images/assets/favicon.png'"
        >

        <div class="luma-ai-product-info">

          <div class="luma-ai-product-name">
            ${escapeHTML(name)}
          </div>

          <div class="luma-ai-product-price">
            ${
              price !== ""
                ? `Rs ${escapeHTML(String(price))}`
                : "Price unavailable"
            }

            ${
              oldPrice !== ""
                ? `<span>Rs ${escapeHTML(String(oldPrice))}</span>`
                : ""
            }
          </div>

          ${
            product.discount
              ? `<div class="luma-ai-product-discount">
                   ${escapeHTML(String(product.discount))}% OFF
                 </div>`
              : ""
          }

        </div>
      `;

      wrapper.appendChild(card);
    });

  container.appendChild(wrapper);

  container.scrollTop =
    container.scrollHeight;
}


              

  function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function loadLumaGenAISDK() {

  return new Promise(
    function (resolve, reject) {

      const script =
        document.createElement("script");

      script.type = "module";

      script.textContent = `
        import {
          GoogleGenAI
        } from "https://esm.run/@google/genai";

        window.GoogleGenAI = GoogleGenAI;

        window.dispatchEvent(
          new Event("luma-genai-loaded")
        );
      `;


      const handler = function () {

        window.removeEventListener(
          "luma-genai-loaded",
          handler
        );

        resolve();
      };


      window.addEventListener(
        "luma-genai-loaded",
        handler
      );


      script.onerror =
        function () {

          reject(
            new Error(
              "Unable to load Gemini Live SDK."
            )
          );

        };


      document.head.appendChild(script);
    }
  );
}


/* =========================================
   MICROPHONE AUDIO
   ========================================= */

function setupLumaMicrophone() {

  lumaAudioContext =
    new AudioContext({
      sampleRate: 16000
    });


  const source =
    lumaAudioContext.createMediaStreamSource(
      lumaMediaStream
    );


  lumaAudioProcessor =
  lumaAudioContext.createScriptProcessor(
    512,
    1,
    1
  );


  lumaAudioProcessor.onaudioprocess =
    function (event) {

      if (
        !lumaVoiceActive ||
        !lumaLiveSession
      ) {
        return;
      }


      const inputData =
        event.inputBuffer.getChannelData(0);


      const pcmData =
        convertFloat32ToInt16(
          inputData
        );


      const base64 =
        arrayBufferToBase64(
          pcmData.buffer
        );


      try {

        lumaLiveSession.sendRealtimeInput({

          audio: {
            data: base64,
            mimeType: "audio/pcm;rate=16000"
          }

        });

      } catch (error) {

        console.error(
          "Audio send error:",
          error
        );

      }

    };


  source.connect(
    lumaAudioProcessor
  );


  lumaAudioProcessor.connect(
    lumaAudioContext.destination
  );
}


/* =========================================
   FLOAT32 → INT16
   ========================================= */

function convertFloat32ToInt16(float32Array) {

  const int16Array =
    new Int16Array(
      float32Array.length
    );


  for (
    let i = 0;
    i < float32Array.length;
    i++
  ) {

    const sample =
      Math.max(
        -1,
        Math.min(
          1,
          float32Array[i]
        )
      );


    int16Array[i] =
      sample < 0
        ? sample * 0x8000
        : sample * 0x7fff;
  }


  return int16Array;
}


/* =========================================
   ARRAY BUFFER → BASE64
   ========================================= */

function arrayBufferToBase64(buffer) {

  let binary = "";

  const bytes =
    new Uint8Array(buffer);

  const chunkSize = 0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ) {

    binary += String.fromCharCode(
      ...bytes.subarray(
        i,
        Math.min(
          i + chunkSize,
          bytes.length
        )
      )
    );

  }


  return btoa(binary);
}

let lumaPlaybackContext = null;
let lumaNextAudioTime = 0;
                          
async function playLumaAudio(base64Audio) {
  try {
    const binary = atob(base64Audio);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    if (!lumaPlaybackContext) {
      lumaPlaybackContext = new AudioContext({
        sampleRate: 24000
      });
    }

    if (lumaPlaybackContext.state === "suspended") {
      await lumaPlaybackContext.resume();
    }

    const int16 = new Int16Array(
      bytes.buffer,
      bytes.byteOffset,
      Math.floor(bytes.byteLength / 2)
    );

    const float32 = new Float32Array(int16.length);

    for (let i = 0; i < int16.length; i++) {
      float32[i] = int16[i] / 32768;
    }

    const audioBuffer =
      lumaPlaybackContext.createBuffer(
        1,
        float32.length,
        24000
      );

    audioBuffer
      .getChannelData(0)
      .set(float32);

    const source =
  lumaPlaybackContext.createBufferSource();

source.buffer = audioBuffer;

source.connect(
  lumaPlaybackContext.destination
);

    /*
     * Schedule every incoming audio chunk
     * continuously without adding a large delay.
     */

    const now =
      lumaPlaybackContext.currentTime;

    if (lumaNextAudioTime < now) {
      lumaNextAudioTime = now + 0.01;
    }

    source.start(lumaNextAudioTime);

    lumaNextAudioTime += audioBuffer.duration;

  } catch (error) {
    console.error(
      "Luma audio playback error:",
      error
    );
  }
}


/* =========================================
   STOP VOICE
   ========================================= */
function stopLumaVoice() {

  lumaVoiceActive = false;


  if (lumaAudioProcessor) {

    try {
      lumaAudioProcessor.disconnect();
    } catch (e) {}

    lumaAudioProcessor = null;
  }


  if (lumaMediaStream) {

    lumaMediaStream
      .getTracks()
      .forEach(
        function (track) {
          track.stop();
        }
      );

    lumaMediaStream = null;
  }


  if (lumaAudioContext) {

    try {
      lumaAudioContext.close();
    } catch (e) {}

    lumaAudioContext = null;
  }


  if (lumaLiveSession) {

    try {
      lumaLiveSession.close();
    } catch (e) {}

    lumaLiveSession = null;
  }


  lumaAudioQueue = [];

  lumaIsPlaying = false;


  /* Close continuous AI voice playback */
  if (lumaPlaybackContext) {

    try {
      lumaPlaybackContext.close();
    } catch (e) {}

    lumaPlaybackContext = null;
  }

  lumaNextAudioTime = 0;


  const voiceButton =
    document.getElementById(
      "luma-ai-voice"
    );


  if (voiceButton) {

    voiceButton.classList.remove(
      "active"
    );

    voiceButton.innerHTML = `
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
    <path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3z" fill="#3BB4EC"/>
    <path d="M17 12c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V22h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" fill="#3BB4EC"/>
  </svg>
`;

    voiceButton.disabled =
      false;
  }


  hideLumaVoiceStatus();
}
